plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	mavenCentral()
}

// The screen sweep is a test robot for the build host, not something a player should be given.
// Its own source set keeps it out of the jar, and keeps src/main from calling it: the only way in
// is Class.forName from NBTEditorClient, which finds nothing in a production launch. It is on the
// client run's classpath and compiled by check, so it cannot rot unnoticed.
sourceSets {
	dev {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
check.dependsOn compileDevJava

loom {
	accessWidenerPath = file("src/main/resources/nbteditor.accesswidener")

	// The dev client and server share a 7.8G host with a VM on it, so neither gets
	// to take the JVM default of a quarter of RAM. See scripts/dev-client.sh.
	runs {
		client {
			source sourceSets.dev
			vmArgs "-Xms256m", "-Xmx1G", "-Dnbte.devrun=client"
			// -Pjoin=host:port sends the client straight into a world, which is the only
			// place item components are bound. See scripts/dev-client.sh --join.
			if (project.hasProperty("join")) {
				programArgs "--quickPlayMultiplayer", project.property("join")
			}
			// -Pdevscreens[=lore] runs dev/DevScreenSweep once joined, which is the only
			// thing in the build that opens an editor screen at all.
			if (project.hasProperty("devscreens")) {
				vmArgs "-Dnbte.devscreens=" + project.property("devscreens")
			}
			if (project.hasProperty("devscreensFrom")) {
				vmArgs "-Dnbte.devscreens.from=" + project.property("devscreensFrom")
			}
			if (project.hasProperty("devscreensNbt")) {
				vmArgs "-Dnbte.devscreens.nbt=" + project.property("devscreensNbt")
			}
			// -Pdevbench[=counts] times the show_entity UUID resolve against a loaded entity
			// count it spawns itself. See dev/DevEntityScanBench.
			if (project.hasProperty("devbench")) {
				vmArgs "-Dnbte.devbench=" + project.property("devbench")
			}
		}
		server {
			runDir = "run/server"
			vmArgs "-Xms256m", "-Xmx1G", "-Dnbte.devrun=server"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.
	
	// implementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
	
	implementation "maven.modrinth:modmenu:20.0.2"
	implementation "maven.modrinth:nbt-autocomplete:1.3.15-fabric-26.2"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version
	
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

def getGitHash() {
	return "git rev-parse --verify --short HEAD".execute().text.trim()
}

// The jar name carries the commit it was built from.
jar {
	archiveClassifier = getGitHash()
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	
	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Only the pure-JVM utility classes are covered. Anything that touches the Minecraft
// client (registries, MinecraftClient, the run directory) cannot run here without a
// Fabric launch — see docs/AUDIT-2026-09-14.md, item 4.
test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
// Mixin configs name their classes as plain strings, so a rename or deletion that misses the
// JSON compiles clean and only surfaces as a crash at game launch. Fail the build instead.
// ponytail: source-file existence only; the toggled names the mixin plugins add at runtime,
// and the @Mixin targets = "..." strings, are still unchecked.
tasks.register("validateMixinConfigs") {
	def configs = fileTree("src/main/resources").matching { include "*.mixins.json" }
	def sourceDir = file("src/main/java")
	inputs.files(configs)
	inputs.dir(sourceDir)
	doLast {
		def missing = []
		configs.each { config ->
			def json = new groovy.json.JsonSlurper().parse(config)
			def pkg = json["package"]
			["mixins", "client", "server"].each { side ->
				(json[side] ?: []).each { name ->
					if (!new File(sourceDir, "${pkg}.${name}".replace(".", "/") + ".java").exists())
						missing << "${config.name} ${side}: ${pkg}.${name}"
				}
			}
		}
		if (!missing.isEmpty())
			throw new GradleException("Mixin classes named in a config but absent:\n\t" + missing.join("\n\t"))
	}
}
check.dependsOn validateMixinConfigs

// src/main reaches the dev source set by name, so a rename or a move there compiles clean and
// silently stops the screen sweep installing. Fail the build instead. Every Class.forName on one
// of the mod's own classes is checked, not just that one.
tasks.register("validateReflectiveNames") {
	def sources = fileTree("src/main/java") { include "**/*.java" }
	def roots = [file("src/main/java"), file("src/dev/java")]
	inputs.files(sources)
	inputs.files(fileTree("src/dev/java"))
	doLast {
		def missing = []
		sources.each { source ->
			(source.text =~ /Class\.forName\("(com\.luneruniverse\.[\w.]+)"\)/).each { match, name ->
				if (!roots.any { new File(it, name.replace(".", "/") + ".java").exists() })
					missing << "${source.name}: ${name}"
			}
		}
		if (!missing.isEmpty())
			throw new GradleException("Class.forName names a class that is not there:\n\t" + missing.join("\n\t"))
	}
}
check.dependsOn validateReflectiveNames

// The configs above only prove the mixin classes exist. tools/check-mixin-targets.py
// resolves what each one points *at* against the mapped jar: the target class, the
// `method` selector, the `@At` member, and whether the selected method's bytecode
// really contains that call. A stale name there compiles and remaps clean and fails
// at launch, and a mixin on a screen class does not fail until that screen opens.
tasks.register("checkMixinTargets") {
	def script = file("tools/check-mixin-targets.py")
	def sources = fileTree("src/main/java") { include "**/mixin/**/*.java" }
	def classpath = configurations.compileClasspath
	inputs.files(script, sources)
	onlyIf {
		if ("which python3".execute().waitFor() == 0) return true
		logger.warn("checkMixinTargets: no python3, skipping")
		false
	}
	doLast {
		if (!classpath.any { it.name.startsWith("minecraft-merged") })
			throw new GradleException("no mapped Minecraft jar on the compile classpath")
		def proc = new ProcessBuilder("python3", script.absolutePath, classpath.asPath)
				.directory(projectDir).redirectErrorStream(true).start()
		proc.inputStream.eachLine { logger.lifecycle(it) }
		if (proc.waitFor() != 0)
			throw new GradleException("mixin targets do not resolve against the compile classpath")
	}
}
check.dependsOn checkMixinTargets

// Loom's validateAccessWidener proves each line names a member that exists. It says nothing
// about whether anything still uses it, or about where. tools/check-widener-consumers.py reads
// the constant pools of the mod's own classes and reports a line with no consumer, and any
// access to a widened member outside util/AccessWidenedApi that vanilla's own modifiers would
// have refused. That is ADR-0003's rule, which nothing else in the build enforces.
tasks.register("checkWidenerConsumers") {
	def script = file("tools/check-widener-consumers.py")
	def widener = file("src/main/resources/nbteditor.accesswidener")
	def classDirs = [sourceSets.main.output.classesDirs, sourceSets.dev.output.classesDirs]
	def classpath = configurations.compileClasspath
	dependsOn compileJava, compileDevJava
	inputs.files(script, widener, classDirs, classpath)
	onlyIf {
		if ("which python3".execute().waitFor() == 0) return true
		logger.warn("checkWidenerConsumers: no python3, skipping")
		false
	}
	doLast {
		// compileClasspath carries the jar Loom already applied the widener to, where every
		// widened member reads as public. The modifier the check needs is the one vanilla
		// shipped, which is in Loom's own merged jar, so that goes first.
		def vanilla = new File(gradle.gradleUserHomeDir,
				"caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
		if (!vanilla.exists())
			throw new GradleException("no un-widened Minecraft jar at ${vanilla}")
		def args = ["python3", script.absolutePath, widener.absolutePath, vanilla.absolutePath]
		classDirs.each { it.each { dir -> args << dir.absolutePath } }
		args << classpath.asPath
		def proc = new ProcessBuilder(args).directory(projectDir).redirectErrorStream(true).start()
		proc.inputStream.eachLine { logger.lifecycle(it) }
		if (proc.waitFor() != 0)
			throw new GradleException("nbteditor.accesswidener does not match ADR-0003")
	}
}
check.dependsOn checkWidenerConsumers

// The tickets the skills read are markdown under .scratch/, because this host has no `gh` CLI.
// tools/check-issue-tracker.py holds them to docs/agents/issue-tracker.md: one file per ticket,
// numbered from 01 without gaps, each carrying a Status from docs/agents/triage-labels.md and a
// heading to append conversation under. A ticket that drifts out of that shape is one the next
// agent does not find, and nothing else in the build looks at .scratch/ at all.
tasks.register("checkIssueTracker") {
	def script = file("tools/check-issue-tracker.py")
	def scratch = file(".scratch")
	// A fileTree rather than inputs.dir, which fails outright on a clone that has no .scratch yet.
	inputs.files(script, fileTree(scratch))
	onlyIf {
		if ("which python3".execute().waitFor() == 0) return true
		logger.warn("checkIssueTracker: no python3, skipping")
		false
	}
	doLast {
		def proc = new ProcessBuilder("python3", script.absolutePath, scratch.absolutePath)
				.directory(projectDir).redirectErrorStream(true).start()
		proc.inputStream.eachLine { logger.lifecycle(it) }
		if (proc.waitFor() != 0)
			throw new GradleException(".scratch/ does not match docs/agents/issue-tracker.md")
	}
}
check.dependsOn checkIssueTracker
